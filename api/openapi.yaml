                "$ref": "#/components/schemas/PlaybackSessionRequest"
              }
            }
          }
        }
      }
    },
    "/api/v1/playback/sessions/{sessionId}": {
      "patch": {
        "operationId": "updatePlaybackSession",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "sessionId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "PlaybackSession",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PlaybackSession"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PlaybackProgressRequest"
              }
            }
          }
        }
      },
      "delete": {
        "operationId": "endPlaybackSession",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "sessionId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Playback session ended"
          }
        }
      }
    },
    "/api/v1/users/me/playback/{itemId}": {
      "get": {
        "operationId": "getMyPlaybackState",
