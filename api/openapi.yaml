    "/api/v1/subtitles/parts/{partId}/decision": {
      "get": {
        "operationId": "getSubtitleDecision",
        "summary": "Admin-only read of durable per-video subtitle decision",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "partId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Current policy; defaults to active",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SubtitleDecision"
                }
              }
            }
          }
        }
      },
      "put": {
        "operationId": "putSubtitleDecision",
        "summary": "Admin-only save skip/review/active policy without editing media",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "partId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SubtitleDecisionUpdate"
