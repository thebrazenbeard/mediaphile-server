    "/api/v1/subtitles/parts/{partId}/published/search": {
      "post": {
        "operationId": "searchPublishedSubtitles",
        "summary": "Explicit admin-only provider metadata lookup; no download or publish",
        "description": "Explicit admin-only metadata search of OpenSubtitles. Results, including empty lists, are cached for 24 hours per media part and canonical query. Provider 429 responses persist a shared one-hour cooldown. SQLite never stores API keys, media paths or subtitle bytes. Searches never download or install subtitles, and skips/review holds always block a lookup even if cached.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "partId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PublishedSubtitleSearchRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Published subtitle candidates, not verified synced subtitles",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PublishedSubtitleSearchReply"
                }
              }
            }
          },
          "409": {
            "description": "Skipped or review-held media cannot search"
          },
          "429": {
            "description": "Provider rate limit reached or persistent one-hour cooldown still active"
          },
          "503": {
            "description": "No API key configured"
          }
        }
      }
    }
  },
