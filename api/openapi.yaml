  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "field": {
                "type": "string"
              }
            }
          }
        }
      },
      "Library": {
        "type": "object",
        "required": [
          "id",
          "name",
          "mediaType",
          "enabled"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "mediaType": {
            "type": "string",
            "enum": [
              "movies",
              "tv"
            ]
          },
          "enabled": {
            "type": "boolean"
          }
        }
      },
      "Item": {
        "type": "object",
        "required": [
          "id",
          "libraryId",
          "kind",
          "title",
          "unresolved"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "libraryId": {
            "type": "string"
          },
          "parentId": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "enum": [
              "movie",
              "show",
              "season",
              "episode"
            ]
          },
          "title": {
            "type": "string"
          },
          "year": {
            "type": "integer"
          },
          "seasonNumber": {
            "type": "integer"
          },
          "episodeNumber": {
            "type": "integer"
          },
          "unresolved": {
            "type": "boolean"
          }
        }
      },
      "PlaybackCapabilities": {
        "type": "object",
        "required": [
          "clientId",
          "containers",
          "videoCodecs",
          "audioCodecs",
          "subtitleCodecs",
          "hls",
          "rangeRequests"
        ],
        "properties": {
          "clientId": {
            "type": "string"
          },
          "containers": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "videoCodecs": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "audioCodecs": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "subtitleCodecs": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "maxWidth": {
            "type": "integer"
          },
          "maxHeight": {
            "type": "integer"
          },
          "maxVideoBitrate": {
            "type": "integer"
          },
          "hls": {
            "type": "boolean"
          },
          "rangeRequests": {
            "type": "boolean"
          }
        }
      },
      "PlaybackDecision": {
        "type": "object",
        "required": [
          "mode",
          "reasons"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "DIRECT_PLAY",
              "REMUX",
              "TRANSCODE",
              "UNPLAYABLE"
            ]
          },
          "sourceId": {
            "type": "string"
          },
          "partId": {
            "type": "string"
          },
          "url": {
            "type": "string"
          },
          "audioStreamId": {
            "type": "string"
          },
          "subtitleStreamId": {
            "type": "string"
          },
          "reasons": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "PlaybackState": {
        "type": "object",
        "required": [
          "itemId",
          "resumeMs",
          "playCount",
          "completed"
        ],
        "properties": {
          "itemId": {
            "type": "string"
          },
          "resumeMs": {
            "type": "integer"
          },
          "playCount": {
            "type": "integer"
          },
          "completed": {
            "type": "boolean"
          }
        }
      },
      "ServerInfo": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "apiVersions": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "initialized": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "name",
          "apiVersions",
          "initialized"
        ]
      },
      "Health": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string"
          },
          "liveness": {
            "type": "string"
          },
          "readiness": {
            "type": "string"
          },
          "capabilities": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": [
          "status",
          "liveness",
          "readiness"
        ]
      },
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "admin": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "username",
          "admin"
        ]
      },
      "AuthResponse": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string"
          },
          "user": {
            "$ref": "#/components/schemas/User"
          }
        },
        "required": [
          "token",
          "user"
        ]
      },
      "AuthRequest": {
        "type": "object",
        "properties": {
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string"
          }
        },
        "required": [
          "username",
          "password"
        ]
      },
      "BootstrapRequest": {
        "type": "object",
        "properties": {
          "bootstrapSecret": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string"
          }
        },
        "required": [
          "bootstrapSecret",
          "username",
          "password"
        ]
      },
      "LibraryList": {
        "type": "object",
        "properties": {
          "libraries": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Library"
            }
          }
        },
        "required": [
          "libraries"
        ]
      },
      "LibraryCreate": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "mediaType": {
            "type": "string"
          },
          "rootPath": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "name",
          "mediaType",
          "rootPath"
        ]
      },
      "ItemPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Item"
            }
          },
          "nextCursor": {
            "type": "string"
          }
        },
        "required": [
          "items",
          "nextCursor"
        ]
      },
      "MediaSource": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "container": {
            "type": "string"
          },
          "durationMs": {
            "type": "integer"
          },
          "bitrate": {
            "type": "integer"
          },
          "width": {
            "type": "integer"
          },
          "height": {
            "type": "integer"
          },
          "videoCodec": {
            "type": "string"
          },
          "audioCodec": {
            "type": "string"
          },
          "hdr": {
            "type": "boolean"
          },
          "available": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "container",
          "available"
        ]
      },
      "MediaPart": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "sourceId": {
            "type": "string"
          },
          "size": {
            "type": "integer"
          },
          "available": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "sourceId",
