    "/api/v1/provenance/import": {
      "post": {
        "operationId": "importProvenance",
        "parameters": [],
        "responses": {
          "200": {
            "description": "importProvenance",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProvenanceResult"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
