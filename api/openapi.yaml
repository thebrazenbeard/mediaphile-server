{
  "openapi": "3.1.0",
  "info": {
    "title": "Mediaphile Server API",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
    "/api/v1/health": {
      "get": {
        "operationId": "getHealth",
        "responses": {
          "200": {
            "description": "Server health"
          }
        }
      }
    },
    "/api/v1/server": {
      "get": {
        "operationId": "getServer",
        "responses": {
          "200": {
            "description": "Server identity and supported API versions"
          }
        }
      }
    },
    "/api/v1/setup/bootstrap": {
      "post": {
        "operationId": "bootstrap",
        "requestBody": {
          "required": true
        },
        "responses": {
          "201": {
            "description": "Administrator created"
          },
          "409": {
            "description": "Already initialized"
          }
        }
      }
    },
    "/api/v1/auth/login": {
      "post": {
        "operationId": "login",
        "requestBody": {
          "required": true
        },
        "responses": {
          "200": {
            "description": "Authenticated"
          }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logout",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "204": {
            "description": "Logged out"
          }
        }
      }
    },
    "/api/v1/libraries": {
      "get": {
        "operationId": "listLibraries",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Libraries"
          }
        }
      },
      "post": {
        "operationId": "createLibrary",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true
        },
        "responses": {
          "201": {
            "description": "Library created"
          }
        }
      }
    },
    "/api/v1/items": {
      "get": {
        "operationId": "listItems",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "libraryId",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "kind",
            "schema": {
              "type": "string",
              "enum": [
                "movie",
                "show",
                "season",
                "episode"
              ]
            }
          },
          {
            "in": "query",
            "name": "parentId",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "q",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "limit",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Paginated items"
          }
        }
      }
    },
    "/api/v1/items/{itemId}": {
      "get": {
        "operationId": "getItem",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "itemId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Item detail and media inventory"
          },
          "404": {
            "description": "Item not found"
          }
        }
      }
    },
    "/api/v1/playback/decide": {
      "post": {
        "operationId": "decidePlayback",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true
        },
        "responses": {
          "200": {
            "description": "Deterministic playback decision"
          }
        }
      }
    },
    "/api/v1/media/{partId}/content": {
      "get": {
        "operationId": "getMediaContent",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "partId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Full media content"
          },
          "206": {
            "description": "Partial media content"
          },
          "416": {
            "description": "Unsatisfiable range"
          }
        }
      },
      "head": {
        "operationId": "headMediaContent",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "partId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Media metadata"
          }
        }
      }
    },
    "/api/v1/playback/sessions": {
      "post": {
        "operationId": "createPlaybackSession",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "Playback session created"
          }
        }
      }
    },
    "/api/v1/playback/sessions/{sessionId}": {
      "patch": {
        "operationId": "updatePlaybackSession",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "sessionId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Playback session updated"
          }
        }
      },
      "delete": {
        "operationId": "endPlaybackSession",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "sessionId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Playback session ended"
          }
        }
      }
    },
    "/api/v1/users/me/playback/{itemId}": {
      "get": {
        "operationId": "getMyPlaybackState",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "itemId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Playback state"
          }
        }
      },
      "put": {
        "operationId": "putMyPlaybackState",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "itemId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Playback state updated"
          }
        }
      }
    },
    "/api/v1/transcode/{sessionId}/{artifact}": {
      "get": {
        "operationId": "getTranscodeArtifact",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "sessionId",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "path",
            "name": "artifact",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "HLS playlist or segment"
          },
          "404": {
            "description": "Artifact unavailable"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "field": {
                "type": "string"
              }
            }
          }
        }
      },
      "Library": {
        "type": "object",
        "required": [
          "id",
          "name",
          "mediaType",
          "enabled"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "mediaType": {
            "type": "string",
            "enum": [
              "movies",
              "tv"
            ]
          },
          "enabled": {
            "type": "boolean"
          }
        }
      },
      "Item": {
        "type": "object",
        "required": [
          "id",
          "libraryId",
          "kind",
          "title",
          "unresolved"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "libraryId": {
            "type": "string"
          },
          "parentId": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "enum": [
              "movie",
              "show",
              "season",
              "episode"
            ]
          },
          "title": {
            "type": "string"
          },
          "year": {
            "type": "integer"
          },
          "seasonNumber": {
            "type": "integer"
          },
          "episodeNumber": {
            "type": "integer"
          },
          "unresolved": {
            "type": "boolean"
          }
        }
      },
      "PlaybackCapabilities": {
        "type": "object",
        "required": [
          "clientId",
          "containers",
          "videoCodecs",
          "audioCodecs",
          "subtitleCodecs",
          "hls",
          "rangeRequests"
        ],
        "properties": {
          "clientId": {
            "type": "string"
          },
          "containers": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "videoCodecs": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "audioCodecs": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "subtitleCodecs": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "maxWidth": {
            "type": "integer"
          },
          "maxHeight": {
            "type": "integer"
          },
          "maxVideoBitrate": {
            "type": "integer"
          },
          "hls": {
            "type": "boolean"
          },
          "rangeRequests": {
            "type": "boolean"
          }
        }
      },
      "PlaybackDecision": {
        "type": "object",
        "required": [
          "mode",
          "reasons"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "DIRECT_PLAY",
              "REMUX",
              "TRANSCODE",
              "UNPLAYABLE"
            ]
          },
          "sourceId": {
            "type": "string"
          },
          "partId": {
            "type": "string"
          },
          "url": {
            "type": "string"
          },
          "audioStreamId": {
            "type": "string"
          },
          "subtitleStreamId": {
            "type": "string"
          },
          "reasons": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "PlaybackState": {
        "type": "object",
        "required": [
          "itemId",
          "resumeMs",
          "playCount",
          "completed"
        ],
        "properties": {
          "itemId": {
            "type": "string"
          },
          "resumeMs": {
            "type": "integer"
          },
          "playCount": {
            "type": "integer"
          },
          "completed": {
            "type": "boolean"
          }
        }
      }
    }
  }
}
