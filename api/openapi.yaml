    },
    "/api/v1/subtitles/decisions/import": {
      "post": {
        "operationId": "importSubtitleExclusions",
        "summary": "Atomically import prior owner-approved skips matched to exact indexed media paths. Existing decisions win.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SubtitleExclusionImport"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Number of newly imported decisions",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "imported": {
                      "type": "integer"
                    },
                    "total": {
                      "type": "integer"
