    "/api/v1/libraries/{libraryId}/subtitles/queue": {
      "get": {
        "operationId": "getLibrarySubtitleQueue",
        "summary": "Read persisted, advisory subtitle recovery queue for a library",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "libraryId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50
            }
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Cached or refreshed page. Not an installed subtitle guarantee.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SubtitleQueuePage"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/libraries/{libraryId}/subtitles/queue/refresh": {
      "post": {
        "operationId": "refreshLibrarySubtitleQueue",
        "summary": "Inspect and persist up to 50 media subtitle decisions without writing media files",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "libraryId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50
            }
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SubtitleQueueRefreshRequest"
              }
            }
