          },
          "hearingImpaired": {
            "type": "boolean"
          },
          "moviehashMatch": {
            "type": "boolean"
          }
        }
      },
      "PublishedSubtitleSearchReply": {
        "type": "object",
        "required": [
          "partId",
          "provider",
          "candidates",
          "downloaded",
          "published",
          "note",
          "cached"
        ],
        "properties": {
          "partId": {
            "type": "string"
          },
          "provider": {
            "type": "string"
          },
          "candidates": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PublishedSubtitleCandidate"
            }
          },
          "downloaded": {
            "type": "boolean"
          },
          "published": {
            "type": "boolean"
          },
          "note": {
            "type": "string"
          },
          "cached": {
            "type": "boolean",
            "description": "True when metadata was served from persistent SQLite cache without a provider request"
          }
        }
      },
      "PublishedSubtitleSearchRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "query": {
            "type": "string",
            "maxLength": 180,
            "description": "Release title only; no full media path"
          },
          "imdbId": {
            "type": "string"
          },
          "year": {
            "type": "integer",
            "minimum": 1900,
            "maximum": 2100
          }
        }
      }
    }
  }
}
