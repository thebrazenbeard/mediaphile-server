          "206": {
            "description": "Partial media content"
          },
          "416": {
            "description": "Unsatisfiable range"
          }
        }
      },
      "head": {
        "operationId": "headMediaContent",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "partId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
