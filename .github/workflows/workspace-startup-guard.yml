name: Mediaphile Server workspace startup safety

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check editor startup source without executing assets
        run: python -m unittest discover -s tests -p test_workspace_startup_safety.py -v
